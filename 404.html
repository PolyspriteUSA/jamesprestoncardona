<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >
  <title>404 | James Preston Cardona</title>
  <meta
    name="description"
    content="Interactive 404 gallery by James Preston Cardona."
  >

  <style>
    :root {
      --bg: #050507;
      --text: #f7f5ff;
      --muted: #aaa6b8;
      --violet: #7149ff;
      --magenta: #ff42d0;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family:
        Arial,
        Helvetica,
        sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    a {
      color: inherit;
      text-decoration: none;
      -webkit-tap-highlight-color: transparent;
    }

    button {
      font: inherit;
    }

    .site-header {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      z-index: 30;
      padding:
        calc(18px + env(safe-area-inset-top))
        24px
        18px;
    }

    .nav {
      width: min(1240px, 100%);
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .brand {
      color: rgba(255,255,255,0.90);
      font-size: 0.74rem;
      font-weight: 700;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 20px;
      color: rgba(255,255,255,0.50);
      font-size: 0.68rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .nav-links a {
      transition: color 180ms ease;
    }

    @media (hover:hover) {
      .nav-links a:hover {
        color: white;
      }
    }

    .error-stage {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background:
        radial-gradient(
          circle at 70% 22%,
          rgba(113,73,255,0.10),
          transparent 34%
        ),
        #050507;
    }

    #gallery {
      position: absolute;
      inset: 0;
      outline: none;
      touch-action: none;
    }

    #gallery canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    .scene-vignette {
      position: absolute;
      z-index: 4;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(
          circle at 50% 48%,
          transparent 38%,
          rgba(4,4,7,0.06) 70%,
          rgba(4,4,7,0.34) 100%
        );
    }

    .error-number {
      position: absolute;
      z-index: 5;
      top: 12vh;
      left: 4vw;
      margin: 0;
      color: rgba(255,255,255,0.045);
      font-size: clamp(8rem, 25vw, 24rem);
      font-weight: 900;
      line-height: 0.8;
      letter-spacing: -0.09em;
      pointer-events: none;
      user-select: none;
    }

    .home-link {
      position: absolute;
      z-index: 12;
      left: 24px;
      bottom:
        calc(
          24px +
          env(safe-area-inset-bottom)
        );
      min-height: 44px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0 19px;
      border:
        1px solid
        rgba(255,255,255,0.12);
      border-radius: 999px;
      background:
        rgba(7,7,11,0.58);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      color: rgba(255,255,255,0.88);
      font-size: 0.67rem;
      font-weight: 700;
      letter-spacing: 0.10em;
      text-transform: uppercase;
      transition:
        transform 180ms ease,
        border-color 180ms ease,
        background 180ms ease;
    }

    .home-link:hover,
    .home-link:focus-visible {
      transform: translateY(-2px);
      border-color:
        rgba(255,66,208,0.30);
      background:
        rgba(17,13,28,0.76);
      outline: none;
    }

    .controls {
      position: absolute;
      z-index: 12;
      right: 24px;
      bottom:
        calc(
          24px +
          env(safe-area-inset-bottom)
        );
      width:
        min(
          315px,
          calc(100% - 48px)
        );
      padding: 14px 16px;
      border:
        1px solid
        rgba(255,255,255,0.08);
      border-radius: 16px;
      background:
        rgba(7,7,12,0.55);
      box-shadow:
        0 18px 50px
        rgba(0,0,0,0.22);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      pointer-events: none;
    }

    .controls-title {
      margin: 0 0 7px;
      color: #fff;
      font-size: 0.68rem;
      font-weight: 800;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    .controls-copy {
      margin: 0;
      color: var(--muted);
      font-size: 0.75rem;
      line-height: 1.55;
    }

    .status {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 10px;
      color: #d7d2e4;
      font-size: 0.69rem;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--magenta);
      box-shadow:
        0 0 15px
        rgba(255,66,208,0.75);
    }

    .touch-controls {
      position: absolute;
      z-index: 18;
      inset:
        auto 14px
        calc(
          14px +
          env(safe-area-inset-bottom)
        )
        14px;
      display: none;
      align-items: flex-end;
      justify-content: space-between;
      pointer-events: none;
    }

    .touch-pad {
      display: grid;
      grid-template-columns:
        repeat(3, 48px);
      grid-template-rows:
        repeat(2, 48px);
      gap: 5px;
      pointer-events: auto;
    }

    .touch-pad button,
    .touch-look button {
      border:
        1px solid
        rgba(255,255,255,0.14);
      border-radius: 13px;
      background:
        rgba(8,7,15,0.74);
      color: #fff;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      touch-action: manipulation;
    }

    .touch-pad .up {
      grid-column: 2;
    }

    .touch-pad .left {
      grid-column: 1;
      grid-row: 2;
    }

    .touch-pad .down {
      grid-column: 2;
      grid-row: 2;
    }

    .touch-pad .right {
      grid-column: 3;
      grid-row: 2;
    }

    .touch-look {
      display: flex;
      gap: 6px;
      pointer-events: auto;
    }

    .touch-look button {
      width: 50px;
      height: 50px;
    }

    @media (max-width: 767px) {
      .site-header {
        padding:
          calc(
            15px +
            env(safe-area-inset-top)
          )
          15px
          15px;
      }

      .brand {
        font-size: 0.62rem;
        letter-spacing: 0.10em;
      }

      .nav-links {
        gap: 12px;
        font-size: 0.59rem;
      }

      .nav-links a:nth-child(2) {
        display: none;
      }

      .controls {
        display: none;
      }

      .home-link {
        left: 50%;
        bottom:
          calc(
            82px +
            env(safe-area-inset-bottom)
          );
        transform:
          translateX(-50%);
      }

      .home-link:hover,
      .home-link:focus-visible {
        transform:
          translate(-50%, -2px);
      }

      .touch-controls {
        display: flex;
      }

      .error-number {
        top: 18vh;
        left: -3vw;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .nav-links a,
      .home-link {
        transition: none;
      }
    }
  </style>
</head>

    <nav class="nav">
      <a

      <div class="nav-links">

  <script>
    (function () {
      const RELEASE_URL =
        "https://github.com/PolyspriteUSA/JamesPrestonCardona/releases/download/portfolio-assets-v1/TheAtlas.mp3";

      const LOCAL_URL =
        "./TheAtlas.mp3";

      const TARGET_VOLUME =
        0.34;

      const atlasMusic =
        new Audio();

      let fallbackTried =
        false;

      let activated =
        false;

      let fadeFrame =
        0;

      atlasMusic.preload =
        "auto";

      atlasMusic.loop =
        true;

      atlasMusic.volume =
        0;

      atlasMusic.src =
        RELEASE_URL;

      atlasMusic.addEventListener(
        "error",
        function () {
          if (
            fallbackTried
          ) {
            return;
          }

          fallbackTried =
            true;

          atlasMusic.src =
            LOCAL_URL;

          atlasMusic.load();
        }
      );

      function fade(
        from,
        to,
        duration,
        done
      ) {
        if (
          fadeFrame
        ) {
          cancelAnimationFrame(
            fadeFrame
          );
        }

        const start =
          performance.now();

        function step(
          now
        ) {
          const t =
            Math.min(
              1,
              (
                now -
                start
              ) /
              duration
            );

          const eased =
            t *
            t *
            (
              3 -
              2 *
              t
            );

          atlasMusic.volume =
            Math.max(
              0,
              Math.min(
                1,
                from +
                (
                  to -
                  from
                ) *
                eased
              )
            );

          if (
            t < 1
          ) {
            fadeFrame =
              requestAnimationFrame(
                step
              );
          } else if (
            typeof done ===
            "function"
          ) {
            done();
          }
        }

        fadeFrame =
          requestAnimationFrame(
            step
          );
      }

      function startMusic() {
        if (
          activated
        ) {
          return;
        }

        activated =
          true;

        atlasMusic.volume =
          0;

        atlasMusic.play().then(
          function () {
            fade(
              0,
              TARGET_VOLUME,
              1800
            );
          }
        ).catch(
          function () {}
        );
      }

      document.addEventListener(
        "pointerdown",
        startMusic,
        {
          once: true,
          passive: true
        }
      );

      document.addEventListener(
        "keydown",
        startMusic,
        {
          once: true
        }
      );

      document.addEventListener(
        "click",
        function (
          event
        ) {
          const link =
            event.target.closest(
              "a[href]"
            );

          if (
            !link ||
            event.defaultPrevented ||
            event.metaKey ||
            event.ctrlKey ||
            event.shiftKey ||
            event.altKey
          ) {
            return;
          }

          const href =
            link.getAttribute(
              "href"
            );

          if (
            !href ||
            href.startsWith("#")
          ) {
            return;
          }

          let destination;

          try {
            destination =
              new URL(
                link.href,
                window.location.href
              );
          } catch (
            error
          ) {
            return;
          }

          event.preventDefault();

          if (
            atlasMusic.paused
          ) {
            window.location.href =
              destination.href;

            return;
          }

          fade(
            atlasMusic.volume,
            0,
            900,
            function () {
              atlasMusic.pause();

              window.location.href =
                destination.href;
            }
          );
        }
      );

      window.__atlasMusic =
        atlasMusic;
    })();
  </script>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.179.1/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.179.1/examples/jsm/"
      }
    }
  </script>

  <script type="module">
    import * as THREE from "three";
    import {
      FBXLoader
    } from "three/addons/loaders/FBXLoader.js";

    const container =
      document.getElementById(
        "gallery"
      );

    const statusText =
      document.getElementById(
        "statusText"
      );

    const reducedMotion =
      window.matchMedia(
        "(prefers-reduced-motion: reduce)"
      );

    const scene =
      new THREE.Scene();

    scene.background =
      new THREE.Color(
        0x09090d
      );

    scene.fog =
      new THREE.FogExp2(
        0x09090d,
        0.0072
      );

    const camera =
      new THREE.PerspectiveCamera(
        43,
        1,
        0.05,
        120
      );

    const renderer =
      new THREE.WebGLRenderer({
        antialias: true,
        powerPreference:
          "high-performance"
      });

    renderer.setPixelRatio(
      Math.min(
        window.devicePixelRatio,
        2
      )
    );

    renderer.outputColorSpace =
      THREE.SRGBColorSpace;

    renderer.toneMapping =
      THREE.ACESFilmicToneMapping;

    renderer.toneMappingExposure =
      1.08;

    renderer.shadowMap.enabled =
      true;

    renderer.shadowMap.type =
      THREE.PCFSoftShadowMap;

    container.appendChild(
      renderer.domElement
    );

    const room =
      new THREE.Group();

    scene.add(
      room
    );

    let reactiveContext =
      null;

    let reactiveAnalyser =
      null;

    let reactiveData =
      null;

    let reactiveSource =
      null;

    let reactiveLevel =
      0;

    let bassLevel =
      0;

    function initAudioReactive() {
      const atlasMusic =
        window.__atlasMusic;

      if (
        !atlasMusic ||
        reactiveAnalyser
      ) {
        return;
      }

      const AudioCtx =
        window.AudioContext ||
        window.webkitAudioContext;

      if (
        !AudioCtx
      ) {
        return;
      }

      reactiveContext =
        window.__atlasReactiveContext ||
        new AudioCtx();

      window.__atlasReactiveContext =
        reactiveContext;

      if (
        !window.__atlasReactiveSource
      ) {
        reactiveSource =
          reactiveContext.createMediaElementSource(
            atlasMusic
          );

        reactiveAnalyser =
          reactiveContext.createAnalyser();

        reactiveAnalyser.fftSize =
          256;

        reactiveAnalyser.smoothingTimeConstant =
          0.84;

        reactiveData =
          new Uint8Array(
            reactiveAnalyser.frequencyBinCount
          );

        reactiveSource.connect(
          reactiveAnalyser
        );

        reactiveAnalyser.connect(
          reactiveContext.destination
        );

        window.__atlasReactiveSource =
          reactiveSource;

        window.__atlasReactiveAnalyser =
          reactiveAnalyser;

        window.__atlasReactiveData =
          reactiveData;
      } else {
        reactiveSource =
          window.__atlasReactiveSource;

        reactiveAnalyser =
          window.__atlasReactiveAnalyser;

        reactiveData =
          window.__atlasReactiveData;
      }

      reactiveContext.resume().catch(
        function () {}
      );
    }

    window.addEventListener(
      "pointerdown",
      initAudioReactive,
      {
        passive: true
      }
    );

    window.addEventListener(
      "keydown",
      initAudioReactive
    );

    function updateAudioReactive() {
      const atlasMusic =
        window.__atlasMusic;

      if (
        !atlasMusic ||
        atlasMusic.paused ||
        !reactiveAnalyser
      ) {
        reactiveLevel +=
          (0 - reactiveLevel) *
          0.06;

        bassLevel +=
          (0 - bassLevel) *
          0.08;

        return;
      }

      reactiveAnalyser.getByteFrequencyData(
        reactiveData
      );

      let bassSum =
        0;

      let lowMidSum =
        0;

      let highSum =
        0;

      let bassCount =
        0;

      let lowMidCount =
        0;

      let highCount =
        0;

      for (
        let i=0;
        i<reactiveData.length;
        i++
      ) {
        const value =
          reactiveData[i] / 255;

        if (
          i < 10
        ) {
          bassSum += value;
          bassCount++;
        } else if (
          i < 28
        ) {
          lowMidSum += value;
          lowMidCount++;
        } else {
          highSum += value;
          highCount++;
        }
      }

      const bassInstant =
        bassCount
          ? bassSum / bassCount
          : 0;

      const lowMidInstant =
        lowMidCount
          ? lowMidSum / lowMidCount
          : 0;

      const highInstant =
        highCount
          ? highSum / highCount
          : 0;

      const overall =
        bassInstant * 0.52 +
        lowMidInstant * 0.32 +
        highInstant * 0.16;

      bassLevel +=
        (bassInstant - bassLevel) *
        0.16;

      reactiveLevel +=
        (overall - reactiveLevel) *
        0.14;
    }

    const ambient =
      new THREE.HemisphereLight(
        0xffffff,
        0x14121a,
        0.72
      );

    scene.add(
      ambient
    );

    const fill =
      new THREE.DirectionalLight(
        0xd9d2ff,
        1.35
      );

    fill.position.set(
      -8,
      11,
      9
    );

    scene.add(
      fill
    );

    const galleryWidth =
      34;

    const galleryDepth =
      46;

    const galleryHeight =
      12;

    const galleryCenterZ =
      -4;

    function makeConcreteTexture() {
      const canvas =
        document.createElement(
          "canvas"
        );

      canvas.width =
        256;

      canvas.height =
        256;

      const context =
        canvas.getContext(
          "2d"
        );

      const image =
        context.createImageData(
          256,
          256
        );

      for (
        let i=0;
        i<image.data.length;
        i+=4
      ) {
        const value =
          118 +
          Math.random() *
          24;

        image.data[i] =
          value;

        image.data[i+1] =
          value;

        image.data[i+2] =
          value;

        image.data[i+3] =
          255;
      }

      context.putImageData(
        image,
        0,
        0
      );

      const texture =
        new THREE.CanvasTexture(
          canvas
        );

      texture.wrapS =
        THREE.RepeatWrapping;

      texture.wrapT =
        THREE.RepeatWrapping;

      texture.repeat.set(
        5,
        5
      );

      return texture;
    }

    const concrete =
      makeConcreteTexture();

    const wallMaterial =
      new THREE.MeshStandardMaterial({
        color: 0x727178,
        roughness: 0.91,
        metalness: 0.015,
        bumpMap: concrete,
        bumpScale: 0.028
      });

    const floorMaterial =
      new THREE.MeshStandardMaterial({
        color: 0x39383e,
        roughness: 0.76,
        metalness: 0.025,
        bumpMap: concrete,
        bumpScale: 0.020
      });

    const ceilingMaterial =
      new THREE.MeshStandardMaterial({
        color: 0x5f5e65,
        roughness: 0.90,
        metalness: 0.015,
        bumpMap: concrete,
        bumpScale: 0.026
      });

    const beamMaterial =
      new THREE.MeshStandardMaterial({
        color: 0x3d3c42,
        roughness: 0.84,
        metalness: 0.04
      });

    function roomMesh(
      geometry,
      material,
      position,
      rotation=null
    ) {
      const mesh =
        new THREE.Mesh(
          geometry,
          material
        );

      mesh.position.set(
        ...position
      );

      if (
        rotation
      ) {
        mesh.rotation.set(
          ...rotation
        );
      }

      mesh.castShadow =
        true;

      mesh.receiveShadow =
        true;

      room.add(
        mesh
      );

      return mesh;
    }

    roomMesh(
      new THREE.PlaneGeometry(
        galleryWidth,
        galleryDepth
      ),
      floorMaterial,
      [
        0,
        0,
        galleryCenterZ
      ],
      [
        -Math.PI/2,
        0,
        0
      ]
    );

    roomMesh(
      new THREE.BoxGeometry(
        galleryWidth,
        0.28,
        galleryDepth
      ),
      ceilingMaterial,
      [
        0,
        galleryHeight,
        galleryCenterZ
      ]
    );

    const backZ =
      galleryCenterZ -
      galleryDepth/2;

    const frontZ =
      galleryCenterZ +
      galleryDepth/2;

    roomMesh(
      new THREE.BoxGeometry(
        galleryWidth,
        galleryHeight,
        0.35
      ),
      wallMaterial,
      [
        0,
        galleryHeight/2,
        backZ
      ]
    );

    roomMesh(
      new THREE.BoxGeometry(
        galleryWidth,
        galleryHeight,

            "uniform float uTime;",

            "varying vec3 vNormal;",

            "varying float vBand;",

            "void main(){",
            "vec3 p=position;",
            "float t=uTime*0.52;",
            "float waveA=sin(p.y*3.3+t*1.2)+cos(p.x*2.9-t*0.8);",
            "float waveB=sin((p.x+p.z)*4.1+t*1.55)+cos(length(p.xz)*5.0-t*1.1);",
            "float pulse=sin(length(p)*4.4-t*1.35);",

            "float twist=sin(p.y*1.7+t*0.7)*0.22+uAudio*0.28;",
            "mat2 rot=mat2(cos(twist),-sin(twist),sin(twist),cos(twist));",
            "p.xz=rot*p.xz;",
            "p.xy+=vec2(sin(p.z*3.4+t),cos(p.x*3.0-t))*0.06;",

            "vBand=0.5+0.5*sin((p.y+p.z)*3.2+t*1.4+uAudio*4.0);",

            "vec3 n=normalize(vNormal);",

    let character =

    const actions = {

    const loader =

    const mateoSources = [
      "https://github.com/PolyspriteUSA/JamesPrestonCardona/releases/download/portfolio-assets-v1/Mateo.fbx",
      "./Mateo.fbx"
    ];

    function loadMateo(
      sourceIndex=0
    ) {
      if (
        sourceIndex >=
        mateoSources.length
      ) {
        statusText.textContent =
          "Mateo.fbx could not be loaded";

        return;
      }

      statusText.textContent =
        sourceIndex === 0
          ? "Loading Mateo.fbx from portfolio assets…"
          : "Trying local Mateo.fbx…";

      loader.load(
        mateoSources[
          sourceIndex
        ],

        function (
          model
        ) {
          character =
            model;

          let box =
            new THREE.Box3()
              .setFromObject(
                character
              );

          const size =
            box.getSize(
              new THREE.Vector3()
            );

          const targetHeight =
            1.78;

          character.scale.multiplyScalar(
            targetHeight /
            Math.max(
              size.y,
              0.001
            )
          );

          character.updateMatrixWorld(
            true
          );

          box =
            new THREE.Box3()
              .setFromObject(
                character
              );

          const center =
            box.getCenter(
              new THREE.Vector3()
            );

          character.position.x -=
            center.x;

          character.position.z -=
            center.z;

          character.position.y -=
            box.min.y;

          character.traverse(
            function (
              object
            ) {
              if (
                !object.isMesh
              ) {
                return;
              }

              object.castShadow =
                true;

              object.receiveShadow =
                true;

              object.frustumCulled =
                false;

              if (
                object.material
              ) {
                const materials =
                  Array.isArray(
                    object.material
                  )
                    ? object.material
                    : [
                        object.material
                      ];

                materials.forEach(
                  function (
                    material
                  ) {
                    if (
                      material &&
                      "side" in
                      material
                    ) {
                      material.side =
                        THREE.DoubleSide;

                      material.needsUpdate =
                        true;
                    }
                  }
                );
              }
            }
          );

          characterRoot.add(
            character
          );

          if (
            model.animations &&
            model.animations.length
          ) {
            mixer =
              new THREE.AnimationMixer(
                character
              );

            const clips =
              model.animations;

            function findClip(
              words
            ) {
              return clips.find(
                function (
                  clip
                ) {
                  const name =
                    (
                      clip.name ||
                      ""
                    ).toLowerCase();

                  return words.some(
                    function (
                      word
                    ) {
                      return name.includes(
                        word
                      );
                    }
                  );
                }
              );
            }

            const idle =
              findClip([
                "idle",
                "stand"
              ]);

            const walk =
              findClip([
                "walk"
              ]);

            const run =
              findClip([
                "run",
                "jog"
              ]);

            if (
              idle
            ) {
              actions.idle =
                mixer.clipAction(
                  idle
                );
            }

            if (
              walk
            ) {
              actions.walk =
                mixer.clipAction(
                  walk
                );
            }

            if (
              run
            ) {
              actions.run =
                mixer.clipAction(
                  run
                );
            }

            currentAction =
              actions.idle ||
              mixer.clipAction(
                clips[0]
              );

            currentAction.play();
          }

          statusText.textContent =
            "Mateo loaded";
        },

        function (
          event
        ) {
          if (
            event.lengthComputable &&
            event.total > 0
          ) {
            statusText.textContent =
              "Loading Mateo.fbx " +
              Math.round(
                event.loaded /
                event.total *
                100
              ) +
              "%";
          }
        },

        function () {
          loadMateo(
            sourceIndex +

          );
        }
      );

    let cameraYaw =

        const dx =

          lastPointerX;

        const dy =
          event.clientY -
          lastPointerY;

        lastPointerX =

        lastPointerY =

    );

    function setAction(
      action
    ) {
      if (
        !action ||
        currentAction ===

      ) {
        return;
      }

      action.reset();

      action.play();

      if (
        currentAction
      ) {

    const moveDirection =
      new THREE.Vector3();

    const cameraForward =
      new THREE.Vector3();

    const cameraRight =
      new THREE.Vector3();

    function updateCharacter(
      delta
    ) {
      let x =
        0;

      let z =
        0;

      if (
        input.forward
      ) {
        z += 1;
      }

      if (
        input.backward
      ) {
        z -= 1;
      }

      if (
        input.left
      ) {
        x -= 1;
      }

      if (
        input.right
      ) {
        x += 1;
      }

      const moving =
        x !== 0 ||
        z !== 0;

      if (
        !moving
      ) {
        if (
          actions.idle
        ) {
          setAction(
            actions.idle
          );
        }

        return;
      }

      cameraForward.set(
        -Math.sin(
          cameraYaw
        ),
        0,
        -Math.cos(
          cameraYaw
        )
      );

      cameraRight.set(
        cameraForward.z,
        0,
        -cameraForward.x
      );

      moveDirection
        .copy(
          cameraForward
        )
        .multiplyScalar(
          z
        )
        .addScaledVector(
          cameraRight,
          x
        )
        .normalize();

      const speed =
        input.run
          ? 4.4
          : 2.45;

      characterRoot.position.addScaledVector(
        moveDirection,
        speed *
        delta
      );

      characterRoot.position.x =
        THREE.MathUtils.clamp(
          characterRoot.position.x,
          -galleryWidth/2+2.4,
          galleryWidth/2-2.4
        );

      characterRoot.position.z =
        THREE.MathUtils.clamp(
          characterRoot.position.z,
          backZ+3.0,
          frontZ-3.0
        );

      const targetRotation =
        Math.atan2(
          moveDirection.x,
          moveDirection.z
        );

      const difference =
        Math.atan2(
          Math.sin(
            targetRotation -
            characterRoot.rotation.y
          ),
          Math.cos(
            targetRotation -
            characterRoot.rotation.y
          )
        );

      characterRoot.rotation.y +=
        difference *
        Math.min(
          1,
          delta *
          8
        );

      if (
        input.run &&
        actions.run
      ) {
        setAction(
          actions.run
        );
      } else if (
        actions.walk
      ) {
        setAction(
          actions.walk
        );
      }
    }

    const cameraTarget =
      new THREE.Vector3();

    const desiredCamera =
      new THREE.Vector3();

    function updateCamera(
      delta
    ) {
      cameraTarget.set(
        characterRoot.position.x,
        1.35,
        characterRoot.position.z
      );

      const horizontal =
        Math.cos(
          cameraPitch
        ) *
        cameraDistance;

      desiredCamera.set(
        cameraTarget.x +
        Math.sin(
          cameraYaw
        ) *
        horizontal,
        cameraTarget.y +
        Math.sin(
          cameraPitch
        ) *
        cameraDistance +
        1.35,
        cameraTarget.z +
        Math.cos(
          cameraYaw
        ) *
        horizontal
      );

      camera.position.lerp(
        desiredCamera,
        1 -
        Math.exp(
          -delta *
          5
        )
      );

      camera.lookAt(
        cameraTarget
      );
    }

    function resize() {
      const width =
        Math.max(

          1
        );

      const height =
        Math.max(
          container.clientHeight,
          1

        height;

      renderer.setSize(
        width,
        height,
        false
      );
    }

    const resizeObserver =
      new ResizeObserver(

    resizeObserver.observe(

    camera.position.set(

      15.4

      0,
      1.35,

    );

    const clock =
      new THREE.Clock();

    function animate() {
      requestAnimationFrame(
        animate
      );

      const delta =
        Math.min(
          clock.getDelta(),
          0.05
        );

      const elapsed =
        clock.elapsedTime;

      updateAudioReactive();

      artworkUniforms.uTime.value =
        elapsed;

      artworkUniforms.uAudio.value =
        reactiveLevel;

      artworkUniforms.uBass.value =
        bassLevel;

      if (
        !reducedMotion.matches
      ) {
        artwork.rotation.y =
          Math.sin(
            elapsed *
            0.16
          ) *
          (
            0.12 +
            reactiveLevel *
            0.12
          );

        artwork.rotation.x =
          Math.sin(
            elapsed *
            0.12
          ) *
          (
            0.04 +
            bassLevel *
            0.08
          );

        const artScale =
          1 +
          reactiveLevel *
          0.09 +
          bassLevel *
          0.05;

        artwork.scale.set(
          1.68 * artScale,
          2.05 * artScale,
          0.78 * artScale
        );

        fogSheetA.material.opacity =
          0.040 +
          Math.sin(
            elapsed *
            0.55
          ) *
          0.012 +
          reactiveLevel *
          0.030;

        fogSheetB.material.opacity =
          0.028 +
          Math.sin(
            elapsed *
            0.40 +
            0.9
          ) *
          0.009 +
          bassLevel *
          0.018;

        fogSheetA.rotation.z =
          Math.sin(
            elapsed *
            0.18
          ) *
          0.03;

        fogSheetB.rotation.z =
          Math.sin(
            elapsed *
            0.11 +
            1.2
          ) *
          0.02;
      } else {
        artwork.scale.set(
          1.68,
          2.05,
          0.78
        );
      }

      magentaLight.intensity =
        9 +
        reactiveLevel *
        11 +
        bassLevel *
        4;

      violetLight.intensity =
        10 +
        reactiveLevel *
        8 +
        bassLevel *
        7;

      ambient.intensity =
        0.72 +
        reactiveLevel *
        0.18;

      fill.intensity =
        1.35 +
        bassLevel *
        0.55;

      updateCharacter(
        delta
      );

      updateCamera(
        delta
      );

      if (
        mixer
      ) {
        mixer.update(
          delta
        );
      }

      renderer.render(
        scene,
        camera
      );
    }

    animate();
  </script>
</body>
</html>
