<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>404 | James Preston Cardona</title>
  <meta name="description" content="Interactive 404 gallery by James Preston Cardona." />
  <style>
    :root {
      --bg: #050507;
      --bg-soft: #0b0b12;
      --text: #f7f5ff;
      --muted: rgba(255,255,255,0.62);
      --line: rgba(255,255,255,0.08);
      --pink: #ff47d6;
      --purple: #7f56ff;
      --white: #faf9ff;
    }

    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
      -webkit-font-smoothing: antialiased;
      touch-action: manipulation;
    }
    body {
      background:
        radial-gradient(circle at 50% 15%, rgba(127,86,255,0.12), transparent 30%),
        radial-gradient(circle at 70% 70%, rgba(255,71,214,0.07), transparent 35%),
        var(--bg);
    }
    a { color: inherit; text-decoration: none; }
    button { font: inherit; }

    .site-header {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      z-index: 30;
      padding: calc(16px + env(safe-area-inset-top)) 20px 14px;
      pointer-events: none;
    }
    .nav {
      width: min(1280px, 100%);
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      pointer-events: auto;
    }
    .brand {
      font-size: 0.74rem;
      font-weight: 700;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.92);
      white-space: nowrap;
    }
    .nav-links {
      display: flex;
      align-items: center;
      gap: 18px;
      flex-wrap: wrap;
      justify-content: flex-end;
      font-size: 0.68rem;
      letter-spacing: 0.13em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.52);
    }
    .nav-links a { transition: color 180ms ease; }
    .nav-links a:hover, .nav-links a:focus-visible { color: rgba(255,255,255,0.98); outline: none; }

    .stage {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }
    #scene {
      position: absolute;
      inset: 0;
      outline: none;
      touch-action: none;
    }
    #scene canvas {
      width: 100%;
      height: 100%;
      display: block;
    }
    .vignette {
      position: absolute;
      inset: 0;
      z-index: 5;
      pointer-events: none;
      background:
        radial-gradient(circle at 50% 48%, transparent 0%, transparent 35%, rgba(4,4,7,0.14) 66%, rgba(4,4,7,0.58) 100%);
    }
    .error-code {
      position: absolute;
      left: max(20px, 3vw);
      top: max(72px, 11vh);
      z-index: 8;
      margin: 0;
      font-size: clamp(7rem, 23vw, 22rem);
      line-height: 0.82;
      letter-spacing: -0.09em;
      font-weight: 900;
      color: rgba(255,255,255,0.045);
      user-select: none;
      pointer-events: none;
    }
    .info {
      position: absolute;
      right: 22px;
      bottom: calc(20px + env(safe-area-inset-bottom));
      z-index: 12;
      width: min(360px, calc(100vw - 44px));
      padding: 15px 16px;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: rgba(7,7,12,0.54);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      box-shadow: 0 10px 40px rgba(0,0,0,0.24);
    }
    .info-title {
      margin: 0 0 8px;
      font-size: 0.76rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.92);
    }
    .info p {
      margin: 0;
      font-size: 0.76rem;
      line-height: 1.6;
      color: var(--muted);
    }
    .home-link {
      position: absolute;
      left: 22px;
      bottom: calc(20px + env(safe-area-inset-bottom));
      z-index: 12;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 44px;
      padding: 0 18px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.12);
      background: rgba(7,7,12,0.58);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      color: rgba(255,255,255,0.94);
      font-size: 0.67rem;
      font-weight: 700;
      letter-spacing: 0.11em;
      text-transform: uppercase;
      transition: transform 180ms ease, border-color 180ms ease, background 180ms ease;
    }
    .home-link:hover, .home-link:focus-visible {
      transform: translateY(-2px);
      background: rgba(14,10,22,0.82);
      border-color: rgba(255,71,214,0.32);
      outline: none;
    }
    .loading {
      position: absolute;
      inset: auto 50% 40px auto;
      transform: translateX(50%);
      z-index: 15;
      padding: 10px 14px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.10);
      background: rgba(8,8,13,0.64);
      color: rgba(255,255,255,0.8);
      font-size: 0.65rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      pointer-events: none;
    }

    @media (max-width: 900px) {
      .nav {
        align-items: flex-start;
        flex-direction: column;
      }
      .nav-links {
        gap: 12px 14px;
        justify-content: flex-start;
      }
      .info {
        right: 14px;
        width: min(320px, calc(100vw - 28px));
      }
      .home-link {
        left: 14px;
      }
      .error-code {
        top: max(88px, 13vh);
      }
    }

    @media (max-width: 640px) {
      .site-header {
        padding-left: 14px;
        padding-right: 14px;
      }
      .brand { font-size: 0.68rem; }
      .nav-links { font-size: 0.62rem; }
      .info {
        left: 14px;
        right: 14px;
        width: auto;
        bottom: calc(76px + env(safe-area-inset-bottom));
      }
      .home-link {
        min-width: 150px;
      }
      .error-code {
        left: 14px;
        font-size: clamp(6rem, 28vw, 9rem);
      }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="nav">
      <a class="brand" href="index.html">James Preston Cardona</a>
      <nav class="nav-links" aria-label="Main navigation">
        <a href="index.html">Home</a>
        <a href="archviz.html">Archviz</a>
        <a href="digitalhuman.html">Digital Human</a>
        <a href="resume.html">Resume</a>
        <a href="index.html#interactive">Interactive</a>
      </nav>
    </div>
  </header>

  <main class="stage">
    <div id="scene" aria-label="3D gallery scene"></div>
    <div class="vignette"></div>
    <h1 class="error-code">404</h1>
    <a class="home-link" href="index.html">Return Home</a>
    <section class="info" aria-label="404 information">
      <h2 class="info-title">Gallery not found</h2>
      <p>
        The page you were looking for drifted out of the archive. Step back to the main site,
        or stay a moment and look at the installation.
      </p>
    </section>
    <div class="loading" id="loadingLabel">Loading gallery…</div>
  </main>

  <audio id="atlasMusic" preload="auto" loop playsinline></audio>


  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { FBXLoader } from 'three/addons/loaders/FBXLoader.js';
    import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
    import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
    import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

    const mount = document.getElementById('scene');
    const loadingLabel = document.getElementById('loadingLabel');
    const atlasMusic = document.getElementById('atlasMusic');

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x050507);
    scene.fog = new THREE.FogExp2(0x0a0911, 0.024);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false, powerPreference: 'high-performance' });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.8));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.08;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    mount.appendChild(renderer.domElement);

    const camera = new THREE.PerspectiveCamera(42, window.innerWidth / window.innerHeight, 0.1, 250);
    camera.position.set(0, 4.35, 18.2);

    const composer = new EffectComposer(renderer);
    composer.addPass(new RenderPass(scene, camera));
    const bloomPass = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 1.35, 0.72, 0.08);
    composer.addPass(bloomPass);

    const clock = new THREE.Clock();
    const targetLook = new THREE.Vector3(0, 4.6, -10.8);
    const viewDrift = new THREE.Vector2();
    const pointer = new THREE.Vector2();
    const mobile = window.matchMedia('(max-width: 768px)').matches;

    // ---------- LIGHTING ----------
    const hemi = new THREE.HemisphereLight(0x6057ff, 0x121017, 0.45);
    scene.add(hemi);

    const ambient = new THREE.AmbientLight(0x8d79ff, 0.26);
    scene.add(ambient);

    const overhead = new THREE.SpotLight(0xffffff, 24, 100, Math.PI / 4.1, 0.48, 1.25);
    overhead.position.set(0, 16, 10);
    overhead.target.position.set(0, 0, -11);
    overhead.castShadow = true;
    overhead.shadow.mapSize.set(1024, 1024);
    scene.add(overhead, overhead.target);

    const artLight = new THREE.PointLight(0xff6fe4, 8, 20, 1.9);
    artLight.position.set(0, 5.2, -10.7);
    scene.add(artLight);

    const artFillLight = new THREE.PointLight(0x7e63ff, 6.4, 18, 2.0);
    artFillLight.position.set(0, 4.4, -9.6);
    scene.add(artFillLight);

    // ---------- ROOM ----------
    const room = new THREE.Group();
    scene.add(room);

    const concreteTex = buildConcreteTexture();
    concreteTex.wrapS = concreteTex.wrapT = THREE.RepeatWrapping;
    concreteTex.repeat.set(10, 14);

    const floorMat = new THREE.MeshStandardMaterial({
      map: concreteTex,
      color: 0x707070,
      roughness: 0.8,
      metalness: 0.02,
      normalScale: new THREE.Vector2(0.45, 0.45),
    });

    const wallMat = new THREE.MeshStandardMaterial({ color: 0x6a6a70, roughness: 0.92, metalness: 0.03 });
    const wallDarkMat = new THREE.MeshStandardMaterial({ color: 0x57575d, roughness: 0.95, metalness: 0.02 });
    const trussMat = new THREE.MeshStandardMaterial({ color: 0x4a4c56, roughness: 0.75, metalness: 0.15 });
    const metalMat = new THREE.MeshStandardMaterial({ color: 0x2a2d36, roughness: 0.48, metalness: 0.42 });

    const floor = new THREE.Mesh(new THREE.PlaneGeometry(36, 48), floorMat);
    floor.rotation.x = -Math.PI / 2;
    floor.receiveShadow = true;
    room.add(floor);

    const backWall = new THREE.Mesh(new THREE.PlaneGeometry(25, 13.8), wallMat);
    backWall.position.set(0, 6.3, -13.4);
    room.add(backWall);

    const leftWall = new THREE.Mesh(new THREE.PlaneGeometry(48, 13.8), wallDarkMat);
    leftWall.rotation.y = Math.PI / 2;
    leftWall.position.set(-12.5, 6.3, 0.6);
    room.add(leftWall);

    const rightWall = new THREE.Mesh(new THREE.PlaneGeometry(48, 13.8), wallDarkMat);
    rightWall.rotation.y = -Math.PI / 2;
    rightWall.position.set(12.5, 6.3, 0.6);
    room.add(rightWall);

    const ceiling = new THREE.Mesh(new THREE.PlaneGeometry(25, 48), new THREE.MeshStandardMaterial({ color: 0x55575f, roughness: 0.9, metalness: 0.02 }));
    ceiling.rotation.x = Math.PI / 2;
    ceiling.position.set(0, 12.7, 0.6);
    room.add(ceiling);

    const frontLintel = new THREE.Mesh(new THREE.BoxGeometry(25.2, 0.6, 0.45), wallDarkMat);
    frontLintel.position.set(0, 12.4, 10.7);
    room.add(frontLintel);

    for (let i = -2; i <= 2; i += 1) {
      const truss = new THREE.Group();
      const z = -8 + i * 7.8;
      const topBeam = new THREE.Mesh(new THREE.BoxGeometry(22.6, 0.16, 0.16), trussMat);
      topBeam.position.set(0, 11.95, z);
      truss.add(topBeam);

      const leftPost = new THREE.Mesh(new THREE.BoxGeometry(0.16, 1.05, 0.16), trussMat);
      leftPost.position.set(-10.2, 11.43, z);
      truss.add(leftPost);
      const rightPost = leftPost.clone();
      rightPost.position.x = 10.2;
      truss.add(rightPost);

      const braceA = new THREE.Mesh(new THREE.BoxGeometry(4.2, 0.10, 0.10), trussMat);
      braceA.position.set(-7.8, 11.6, z);
      braceA.rotation.z = Math.PI / 7;
      truss.add(braceA);
      const braceB = braceA.clone();
      braceB.position.x = 7.8;
      braceB.rotation.z = -Math.PI / 7;
      truss.add(braceB);

      room.add(truss);
    }

    // ---------- BENCH ----------
    const bench = new THREE.Group();
    const seat = new THREE.Mesh(new THREE.BoxGeometry(3.6, 0.16, 1.08), metalMat);
    seat.position.set(0, 1.1, 0);
    seat.castShadow = true;
    bench.add(seat);

    const back = new THREE.Mesh(new THREE.BoxGeometry(3.6, 0.78, 0.14), metalMat);
    back.position.set(0, 1.52, -0.47);
    back.castShadow = true;
    bench.add(back);

    [-1.5, 1.5].forEach((x) => {
      [-0.35, 0.35].forEach((z) => {
        const leg = new THREE.Mesh(new THREE.BoxGeometry(0.11, 1.0, 0.11), metalMat);
        leg.position.set(x, 0.5, z);
        leg.castShadow = true;
        bench.add(leg);
      });
    });
    bench.position.set(0, 0, 7.9);
    room.add(bench);

    // ---------- FRAME ----------
    const frameGroup = new THREE.Group();
    frameGroup.position.set(0, 5.3, -13.12);
    scene.add(frameGroup);

    const frameMat = new THREE.MeshStandardMaterial({
      color: 0x171820,
      roughness: 0.42,
      metalness: 0.34
    });

    const frameWidth = 10.8;
    const frameHeight = 7.1;
    const frameThickness = 0.44;
    const frameDepth = 0.46;

    const frameTop = new THREE.Mesh(
      new THREE.BoxGeometry(
        frameWidth,
        frameThickness,
        frameDepth
      ),
      frameMat
    );
    frameTop.position.y =
      frameHeight * 0.5 -
      frameThickness * 0.5;
    frameTop.castShadow = true;
    frameGroup.add(frameTop);

    const frameBottom =
      frameTop.clone();
    frameBottom.position.y =
      -frameTop.position.y;
    frameGroup.add(frameBottom);

    const frameLeft = new THREE.Mesh(
      new THREE.BoxGeometry(
        frameThickness,
        frameHeight - frameThickness * 2,
        frameDepth
      ),
      frameMat
    );
    frameLeft.position.x =
      -frameWidth * 0.5 +
      frameThickness * 0.5;
    frameLeft.castShadow = true;
    frameGroup.add(frameLeft);

    const frameRight =
      frameLeft.clone();
    frameRight.position.x =
      -frameLeft.position.x;
    frameGroup.add(frameRight);

    const artPortal = new THREE.Group();
    artPortal.position.set(0, 0, 0.32);
    frameGroup.add(artPortal);

    const portalBorder = new THREE.Mesh(
      new THREE.PlaneGeometry(9.86, 6.14),
      new THREE.MeshBasicMaterial({ color: 0x08080d })
    );
    portalBorder.position.z = -0.03;
    artPortal.add(portalBorder);

    // ---------- PROCEDURAL 3D ARTWORK ----------
    const artGroup =
      new THREE.Group();

    // Pull the whole sculpture well in front of the frame.
    artGroup.position.set(
      0,
      0,
      1.20
    );

    artGroup.scale.set(
      1.16,
      1.16,
      1.16
    );

    artPortal.add(
      artGroup
    );

    const ribbonContainer =
      new THREE.Group();

    artGroup.add(
      ribbonContainer
    );

    const ribbonPalette = [
      0xff45d2,
      0xff6add,
      0x8b65ff,
      0xb97cff,
      0xfff4ff,
      0xff8be8
    ];

    const mainRibbons = [];
    const filamentLoops = [];

    function buildRibbonCurve(
      ribbon,
      time
    ) {
      const points = [];
      const pointCount = 28;

      for (
        let i=0;
        i<pointCount;
        i++
      ) {
        const t =
          i /
          pointCount;

        const a =
          t *
          Math.PI *
          2;

        const wobbleA =
          Math.sin(
            a *
            ribbon.lobeA +
            time *
            ribbon.speed +
            ribbon.phase
          );

        const wobbleB =
          Math.cos(
            a *
            ribbon.lobeB -
            time *
            ribbon.speed *
            0.72 +
            ribbon.phase *
            0.63
          );

        const radius =
          ribbon.radius +
          wobbleA *
          ribbon.waveA +
          wobbleB *
          ribbon.waveB;

        const x =
          Math.cos(
            a +
            ribbon.twist *
            wobbleB
          ) *
          radius *
          ribbon.scaleX +
          Math.sin(
            a *
            3.0 +
            time *
            0.18 +
            ribbon.phase
          ) *
          0.36;

        const y =
          Math.sin(
            a *
            ribbon.yCycles +
            ribbon.phase
          ) *
          ribbon.scaleY +
          Math.cos(
            a *
            2.0 -
            time *
            0.24
          ) *
          0.56;

        const z =
          ribbon.depthOffset +
          Math.sin(
            a *
            ribbon.zCycles -
            time *
            ribbon.speed *
            0.55 +
            ribbon.phase
          ) *
          ribbon.depth +
          Math.cos(
            a *
            3.0 +
            ribbon.phase
          ) *
          0.32;

        points.push(
          new THREE.Vector3(
            x,
            y,
            z
          )
        );
      }

      return new THREE.CatmullRomCurve3(
        points,
        true,
        "centripetal",
        0.72
      );
    }

    function createMainRibbon(
      index
    ) {
      const color =
        new THREE.Color(
          ribbonPalette[
            index %
            ribbonPalette.length
          ]
        );

      const ribbon = {
        phase:
          index *
          0.77 +
          0.28,
        radius:
          1.65 +
          (
            index %
            4
          ) *
          0.18,
        scaleX:
          1.20 +
          (
            index %
            3
          ) *
          0.12,
        scaleY:
          1.55 +
          (
            index %
            5
          ) *
          0.10,
        depth:
          1.0 +
          (
            index %
            4
          ) *
          0.24,
        depthOffset:
          0.42 +
          (
            index %
            3
          ) *
          0.16,
        lobeA:
          2 +
          (
            index %
            4
          ),
        lobeB:
          3 +
          (
            index %
            3
          ),
        yCycles:
          1.0 +
          (
            index %
            3
          ) *
          0.5,
        zCycles:
          1.5 +
          (
            index %
            4
          ) *
          0.5,
        twist:
          0.25 +
          (
            index %
            3
          ) *
          0.12,
        waveA:
          0.26 +
          (
            index %
            4
          ) *
          0.06,
        waveB:
          0.18 +
          (
            index %
            3
          ) *
          0.05,
        speed:
          0.17 +
          (
            index %
            5
          ) *
          0.018,
        thickness:
          0.10 +
          (
            index %
            4
          ) *
          0.026,
        color:
          color,
        mesh:
          null,
        coreLine:
          null,
        light:
          null
      };

      const curve =
        buildRibbonCurve(
          ribbon,
          0
        );

      const tubeGeometry =
        new THREE.TubeGeometry(
          curve,
          112,
          ribbon.thickness,
          14,
          true
        );

      const tubeMaterial =
        new THREE.MeshPhysicalMaterial({
          color:
            color.clone()
              .lerp(
                new THREE.Color(
                  0xffffff
                ),
                0.08
              ),
          emissive:
            color,
          emissiveIntensity:
            index %
            5 ===
            4
              ? 4.4
              : 3.2,
          roughness: 0.16,
          metalness: 0.02,
          clearcoat: 0.70,
          clearcoatRoughness: 0.12,
          transmission: 0.10,
          thickness: 0.7,
          transparent: true,
          opacity: 0.96,
          side:
            THREE.DoubleSide
        });

      const mesh =
        new THREE.Mesh(
          tubeGeometry,
          tubeMaterial
        );

      mesh.castShadow =
        true;

      mesh.frustumCulled =
        false;

      ribbon.mesh =
        mesh;

      ribbonContainer.add(
        mesh
      );

      const linePoints =
        curve.getPoints(
          180
        );

      const lineGeometry =
        new THREE.BufferGeometry()
          .setFromPoints(
            linePoints
          );

      const lineMaterial =
        new THREE.LineBasicMaterial({
          color:
            index %
            4 ===
            0
              ? 0xffffff
              : color,
          transparent: true,
          opacity: 0.88,
          blending:
            THREE.AdditiveBlending,
          depthWrite: false,
          toneMapped: false
        });

      const coreLine =
        new THREE.LineLoop(
          lineGeometry,
          lineMaterial
        );

      coreLine.frustumCulled =
        false;

      ribbon.coreLine =
        coreLine;

      ribbonContainer.add(
        coreLine
      );

      const light =
        new THREE.PointLight(
          color,
          3.4,
          8.5,
          1.8
        );

      const lightPoint =
        curve.getPoint(
          0.48
        );

      light.position.copy(
        lightPoint
      );

      ribbon.light =
        light;

      ribbonContainer.add(
        light
      );

      return ribbon;
    }

    for (
      let i=0;
      i<13;
      i++
    ) {
      mainRibbons.push(
        createMainRibbon(
          i
        )
      );
    }

    function createFilament(
      index
    ) {
      const points = [];
      const pointCount = 90;

      for (
        let i=0;
        i<pointCount;
        i++
      ) {
        const t =
          i /
          pointCount;

        const a =
          t *
          Math.PI *
          2;

        const radius =
          1.85 +
          Math.sin(
            a *
            (
              3 +
              index %
              4
            ) +
            index
          ) *
          0.48;

        points.push(
          new THREE.Vector3(
            Math.cos(
              a +
              index *
              0.37
            ) *
            radius *
            (
              1.28 +
              (
                index %
                3
              ) *
              0.09
            ),
            Math.sin(
              a *
              (
                1 +
                (
                  index %
                  4
                ) *
                0.5
              ) +
              index *
              0.23
            ) *
            (
              1.45 +
              (
                index %
                5
              ) *
              0.10
            ),
            0.55 +
            Math.sin(
              a *
              (
                2 +
                (
                  index %
                  5
                )
              ) -
              index *
              0.42
            ) *
            (
              0.95 +
              (
                index %
                4
              ) *
              0.16
            )
          )
        );
      }

      const geometry =
        new THREE.BufferGeometry()
          .setFromPoints(
            points
          );

      const color =
        ribbonPalette[
          index %
          ribbonPalette.length
        ];

      const material =
        new THREE.LineBasicMaterial({
          color:
            index %
            5 ===
            0
              ? 0xffffff
              : color,
          transparent: true,
          opacity:
            0.26 +
            (
              index %
              4
            ) *
            0.08,
          blending:
            THREE.AdditiveBlending,
          depthWrite: false,
          toneMapped: false
        });

      const line =
        new THREE.LineLoop(
          geometry,
          material
        );

      line.userData = {
        baseRotation:
          new THREE.Euler(
            index *
            0.21,
            index *
            0.31,
            index *
            0.16
          ),
        speed:
          0.025 +
          (
            index %
            7
          ) *
          0.005,
        phase:
          index *
          0.48
      };

      line.rotation.copy(
        line.userData.baseRotation
      );

      filamentLoops.push(
        line
      );

      ribbonContainer.add(
        line
      );
    }

    for (
      let i=0;
      i<34;
      i++
    ) {
      createFilament(
        i
      );
    }

    const luminousCore =
      new THREE.Mesh(
        new THREE.SphereGeometry(
          1,
          32,
          24
        ),
        new THREE.MeshBasicMaterial({
          color: 0xff55d4,
          transparent: true,
          opacity: 0.10,
          blending:
            THREE.AdditiveBlending,
          depthWrite: false,
          toneMapped: false
        })
      );

    luminousCore.scale.set(
      2.5,
      1.75,
      1.25
    );

    luminousCore.position.z =
      0.55;

    artGroup.add(
      luminousCore
    );

    const coreLight =
      new THREE.PointLight(
        0xff59d6,
        18,
        18,
        1.7
      );

    coreLight.position.set(
      0,
      0,
      1.55
    );

    artGroup.add(
      coreLight
    );

    const violetCoreLight =
      new THREE.PointLight(
        0x7858ff,
        12,
        16,
        1.8
      );

    violetCoreLight.position.set(
      -1.4,
      0.8,
      0.8
    );

    artGroup.add(
      violetCoreLight
    );

    const whiteCoreLight =
      new THREE.PointLight(
        0xffeaff,
        6,
        12,
        1.8
      );

    whiteCoreLight.position.set(
      1.2,
      -0.4,
      1.9
    );

    artGroup.add(
      whiteCoreLight
    );

    // ---------- MATTEO / fallback figure ----------
    const characterGroup = new THREE.Group();
    characterGroup.position.set(-4.8, 0, 4.6);
    scene.add(characterGroup);

    let mateoLoaded = false;
    addFallbackFigure();
    tryLoadMateo();

    function addFallbackFigure() {
      const fallback = new THREE.Group();
      fallback.name = 'mateo-fallback';
      const bodyMat = new THREE.MeshStandardMaterial({ color: 0x2d3141, roughness: 0.72, metalness: 0.08 });
      const accentMat = new THREE.MeshStandardMaterial({ color: 0x7f56ff, roughness: 0.45, metalness: 0.16, emissive: 0x3c1a78, emissiveIntensity: 0.5 });

      const torso = new THREE.Mesh(new THREE.BoxGeometry(0.72, 1.2, 0.34), bodyMat);
      torso.position.y = 1.5;
      torso.castShadow = true;
      fallback.add(torso);
      const head = new THREE.Mesh(new THREE.BoxGeometry(0.46, 0.52, 0.46), bodyMat);
      head.position.set(0, 2.42, 0);
      head.castShadow = true;
      fallback.add(head);
      const hoodie = new THREE.Mesh(new THREE.BoxGeometry(0.82, 1.28, 0.38), accentMat);
      hoodie.position.set(0, 1.5, -0.02);
      fallback.add(hoodie);

      [[-0.25,0.7],[0.25,0.7],[-0.18,-0.7],[0.18,-0.7]].forEach(([x,y], idx) => {
        const limb = new THREE.Mesh(new THREE.BoxGeometry(idx < 2 ? 0.17 : 0.2, idx < 2 ? 0.92 : 1.0, 0.17), bodyMat);
        limb.position.set(x, idx < 2 ? 1.55 : 0.55, y * 0.18);
        if (idx < 2) limb.position.x = idx === 0 ? -0.58 : 0.58;
        if (idx < 2) limb.position.y = 1.55;
        if (idx < 2) limb.rotation.z = idx === 0 ? 0.14 : -0.14;
        if (idx >= 2) limb.position.x = idx === 2 ? -0.18 : 0.18;
        limb.castShadow = true;
        fallback.add(limb);
      });
      fallback.rotation.y = Math.PI * 0.28;
      characterGroup.add(fallback);
    }

    function tryLoadMateo() {
      const loader = new FBXLoader();
      const candidates = [
        './portfolio-assets-v1/Mateo.fbx',
        'portfolio-assets-v1/Mateo.fbx',
        './Mateo.fbx',
        'Mateo.fbx'
      ];

      let idx = 0;
      const attempt = () => {
        if (idx >= candidates.length) {
          loadingLabel.textContent = 'Gallery loaded';
          setTimeout(() => loadingLabel.style.display = 'none', 1200);
          return;
        }
        const url = candidates[idx++];
        loader.load(
          url,
          (fbx) => {
            mateoLoaded = true;
            const fallback = characterGroup.getObjectByName('mateo-fallback');
            if (fallback) characterGroup.remove(fallback);
            fbx.scale.setScalar(0.01 * 100); // honor previous x100 request if source is tiny
            const box = new THREE.Box3().setFromObject(fbx);
            const size = new THREE.Vector3();
            box.getSize(size);
            const maxDim = Math.max(size.x, size.y, size.z) || 1;
            const desired = 2.1;
            const adjust = desired / maxDim;
            fbx.scale.multiplyScalar(adjust);
            const newBox = new THREE.Box3().setFromObject(fbx);
            const center = new THREE.Vector3();
            newBox.getCenter(center);
            const min = newBox.min.clone();
            fbx.position.sub(center);
            fbx.position.y -= min.y;
            fbx.traverse((child) => {
              if (child.isMesh) {
                child.castShadow = true;
                child.receiveShadow = true;
                if (child.material) {
                  child.material.side = THREE.DoubleSide;
                }
              }
            });
            fbx.rotation.y = Math.PI * 0.28;
            characterGroup.add(fbx);
            loadingLabel.textContent = 'Gallery loaded';
            setTimeout(() => loadingLabel.style.display = 'none', 1200);
          },
          undefined,
          () => attempt()
        );
      };
      attempt();
    }

    // ---------- AUDIO ----------
    const audioListener = new THREE.AudioListener();
    camera.add(audioListener);
    const analyserData = { value: 0 };
    const musicCandidates = [
      './portfolio-assets-v1/TheAtlas.mp3',
      'portfolio-assets-v1/TheAtlas.mp3',
      './TheAtlas.mp3',
      'TheAtlas.mp3'
    ];
    let musicCandidateIndex = 0;
    atlasMusic.volume = 0;
    atlasMusic.src = musicCandidates[musicCandidateIndex];
    let audioReady = false;
    let audioStarted = false;
    let targetVolume = 0.36;

    atlasMusic.addEventListener('error', () => {
      musicCandidateIndex += 1;
      if (musicCandidateIndex < musicCandidates.length) {
        atlasMusic.src = musicCandidates[musicCandidateIndex];
        atlasMusic.load();
      }
    });

    atlasMusic.addEventListener('canplay', () => { audioReady = true; });

    async function startMusic() {
      if (audioStarted) return;
      audioStarted = true;
      try {
        if (!atlasMusic.src) atlasMusic.src = musicCandidates[0];
        await atlasMusic.play();
      } catch (err) {
        audioStarted = false;
      }
    }

    function triggerAudioStart() { startMusic(); }
    window.addEventListener('pointerdown', triggerAudioStart, { passive: true, once: true });
    window.addEventListener('touchstart', triggerAudioStart, { passive: true, once: true });
    window.addEventListener('keydown', triggerAudioStart, { once: true });

    // ---------- INPUT ----------
    window.addEventListener('pointermove', (e) => {
      pointer.x = (e.clientX / window.innerWidth) * 2 - 1;
      pointer.y = (e.clientY / window.innerHeight) * 2 - 1;
    }, { passive: true });

    // ---------- HELPERS ----------
    function buildConcreteTexture() {
      const size = 256;
      const canvas = document.createElement('canvas');
      canvas.width = canvas.height = size;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#77777d';
      ctx.fillRect(0, 0, size, size);
      const img = ctx.getImageData(0, 0, size, size);
      const data = img.data;
      for (let i = 0; i < data.length; i += 4) {
        const n = 118 + Math.random() * 42;
        data[i] = n;
        data[i+1] = n - 2;
        data[i+2] = n - 5;
        data[i+3] = 255;
      }
      ctx.putImageData(img, 0, 0);
      for (let i = 0; i < 900; i += 1) {
        const x = Math.random() * size;
        const y = Math.random() * size;
        const r = 1 + Math.random() * 3;
        ctx.fillStyle = `rgba(255,255,255,${0.02 + Math.random() * 0.035})`;
        ctx.beginPath();
        ctx.arc(x, y, r, 0, Math.PI * 2);
        ctx.fill();
      }
      return new THREE.CanvasTexture(canvas);
    }

    function updateArtwork(
      time,
      audioBoost
    ) {
      const pulse =
        1 +
        audioBoost *
        0.08;

      artGroup.scale.set(
        1.16 *
        pulse,
        1.16 *
        pulse,
        1.16 *
        (
          1 +
          audioBoost *
          0.16
        )
      );

      artGroup.rotation.y =
        Math.sin(
          time *
          0.085
        ) *
        0.12;

      artGroup.rotation.x =
        Math.cos(
          time *
          0.064
        ) *
        0.045;

      artGroup.position.z =
        1.20 +
        Math.sin(
          time *
          0.22
        ) *
        0.12;

      mainRibbons.forEach(
        (
          ribbon,
          index
        ) => {
          const curve =
            buildRibbonCurve(
              ribbon,
              time *
              0.60
            );

          const tubeGeometry =
            new THREE.TubeGeometry(
              curve,
              112,
              ribbon.thickness *
              (
                1 +
                audioBoost *
                0.14
              ),
              14,
              true
            );

          ribbon.mesh.geometry.dispose();

          ribbon.mesh.geometry =
            tubeGeometry;

          ribbon.mesh.material.emissiveIntensity =
            (
              index %
              5 ===
              4
                ? 4.3
                : 3.0
            ) +
            audioBoost *
            2.4 +
            Math.sin(
              time *
              0.36 +
              index
            ) *
            0.30;

          const linePoints =
            curve.getPoints(
              180
            );

          ribbon.coreLine.geometry.dispose();

          ribbon.coreLine.geometry =
            new THREE.BufferGeometry()
              .setFromPoints(
                linePoints
              );

          ribbon.coreLine.material.opacity =
            0.74 +
            audioBoost *
            0.20;

          const lightPoint =
            curve.getPoint(
              0.45 +
              Math.sin(
                time *
                0.20 +
                index
              ) *
              0.15
            );

          ribbon.light.position.copy(
            lightPoint
          );

          ribbon.light.intensity =
            2.4 +
            audioBoost *
            4.5 +
            Math.sin(
              time *
              0.50 +
              index
            ) *
            0.45;
        }
      );

      filamentLoops.forEach(
        (
          line,
          index
        ) => {
          const base =
            line.userData.baseRotation;

          line.rotation.set(
            base.x +
            Math.sin(
              time *
              line.userData.speed +
              line.userData.phase
            ) *
            0.28,
            base.y +
            Math.cos(
              time *
              (
                line.userData.speed *
                0.84
              ) +
              line.userData.phase
            ) *
            0.34,
            base.z +
            Math.sin(
              time *
              (
                line.userData.speed *
                1.12
              ) +
              line.userData.phase
            ) *
            0.20
          );

          line.material.opacity =
            0.20 +
            (
              0.5 +
              0.5 *
              Math.sin(
                time *
                0.42 +
                index *
                0.6
              )
            ) *
            0.26 +
            audioBoost *
            0.12;
        }
      );

      luminousCore.scale.set(
        2.45 +
        Math.sin(
          time *
          0.34
        ) *
        0.20 +
        audioBoost *
        0.32,
        1.72 +
        Math.cos(
          time *
          0.28
        ) *
        0.12 +
        audioBoost *
        0.18,
        1.20 +
        Math.sin(
          time *
          0.42
        ) *
        0.14 +
        audioBoost *
        0.26
      );

      luminousCore.material.opacity =
        0.08 +
        audioBoost *
        0.10;

      coreLight.intensity =
        17 +
        audioBoost *
        16;

      violetCoreLight.intensity =
        11 +
        audioBoost *
        10;

      whiteCoreLight.intensity =
        5 +
        audioBoost *
        8;

      artLight.intensity =
        8.5 +
        audioBoost *
        10;

      artFillLight.intensity =
        7 +
        audioBoost *
        8;
    }

    function updateAudio(dt) {
      if (!atlasMusic.paused) {
        atlasMusic.volume = THREE.MathUtils.damp(atlasMusic.volume, targetVolume, 2.2, dt);
        const faux = 0.18 + Math.sin(clock.elapsedTime * 0.96) * 0.08 + Math.sin(clock.elapsedTime * 2.7) * 0.04;
        analyserData.value = Math.max(0, faux);
      } else {
        atlasMusic.volume = THREE.MathUtils.damp(atlasMusic.volume, 0, 3, dt);
        analyserData.value = THREE.MathUtils.damp(analyserData.value, 0, 3, dt);
      }
    }

    function animate() {
      requestAnimationFrame(animate);
      const dt = Math.min(clock.getDelta(), 0.033);
      const elapsed = clock.elapsedTime;

      updateAudio(dt);
      const audioBoost = analyserData.value;
      updateArtwork(elapsed, audioBoost);

      const targetX = pointer.x * 0.55;
      const targetY = -pointer.y * 0.28;
      viewDrift.x = THREE.MathUtils.damp(viewDrift.x, targetX, 1.6, dt);
      viewDrift.y = THREE.MathUtils.damp(viewDrift.y, targetY, 1.6, dt);

      camera.position.x = THREE.MathUtils.damp(camera.position.x, viewDrift.x, 1.3, dt);
      camera.position.y = THREE.MathUtils.damp(camera.position.y, 4.35 + viewDrift.y, 1.3, dt);
      camera.position.z = THREE.MathUtils.damp(camera.position.z, mobile ? 19.0 : 18.2, 1.5, dt);
      tmpVec.copy(targetLook).add(new THREE.Vector3(viewDrift.x * 0.15, viewDrift.y * 0.05, 0));
      camera.lookAt(tmpVec);

      const artPulse = 0.5 + audioBoost * 2.0;
      overhead.intensity = 22 + artPulse * 2.5;
      composer.render();
    }

    animate();

    function resize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      composer.setSize(window.innerWidth, window.innerHeight);
      bloomPass.setSize(window.innerWidth, window.innerHeight);
      if (window.innerWidth < 640) {
        camera.fov = 48;
        camera.position.z = 19.3;
      } else if (window.innerWidth < 1024) {
        camera.fov = 45;
        camera.position.z = 18.8;
      } else {
        camera.fov = 42;
        camera.position.z = 18.2;
      }
      camera.updateProjectionMatrix();
    }
    window.addEventListener('resize', resize);
    resize();
  </script>
</body>
