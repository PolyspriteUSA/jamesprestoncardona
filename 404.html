<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>404 | James Preston Cardona</title>
<style>
    :root{
      --bg:#050507;
      --panel:rgba(8,10,18,0.46);
      --line:rgba(255,255,255,0.10);
      --text:#f6f2ff;
      --muted:rgba(255,255,255,0.66);
      --pink:#ff49cf;
      --purple:#845dff;
      --white:#ffffff;
    }
    *{box-sizing:border-box}
    html,body{
      margin:0;
      width:100%;
      height:100%;
      overflow:hidden;
      background:var(--bg);
      color:var(--text);
      font-family:Arial, Helvetica, sans-serif;
      -webkit-font-smoothing:antialiased;
      text-rendering:optimizeLegibility;
    }
    canvas{display:block}
    #app{position:fixed; inset:0}
    .ui{
      position:fixed;
      inset:0;
      pointer-events:none;
      z-index:10;
    }
    .nav{
      position:absolute;
      inset:0 0 auto 0;
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:16px;
      padding:calc(18px + env(safe-area-inset-top)) 24px 18px;
    }
    .brand,
    .navlinks{
      pointer-events:auto;
    }
    .brand{
      color:rgba(255,255,255,0.95);
      text-decoration:none;
      text-transform:uppercase;
      letter-spacing:0.18em;
      font-size:0.76rem;
      font-weight:700;
      white-space:nowrap;
    }
    .navlinks{
      display:flex;
      flex-wrap:wrap;
      align-items:center;
      justify-content:flex-end;
      gap:18px;
    }
    .navlinks a{
      color:rgba(255,255,255,0.62);
      text-decoration:none;
      text-transform:uppercase;
      letter-spacing:0.12em;
      font-size:0.68rem;
      transition:color 180ms ease, opacity 180ms ease;
    }
    .navlinks a:hover,
    .navlinks a:focus-visible{
      color:#fff;
      outline:none;
    }
    .hero404{
      position:absolute;
      top:10vh;
      left:4vw;
      margin:0;
      font-size:clamp(7rem, 23vw, 20rem);
      line-height:0.82;
      letter-spacing:-0.08em;
      font-weight:900;
      color:rgba(255,255,255,0.045);
      user-select:none;
    }
    .panel{
      position:absolute;
      left:24px;
      bottom:calc(24px + env(safe-area-inset-bottom));
      width:min(540px, calc(100vw - 48px));
      padding:18px 20px 20px;
      border:1px solid var(--line);
      border-radius:24px;
      background:var(--panel);
      backdrop-filter:blur(20px);
      -webkit-backdrop-filter:blur(20px);
      box-shadow:0 20px 64px rgba(0,0,0,0.35);
      pointer-events:auto;
    }
    .eyebrow{
      margin:0 0 10px 0;
      color:rgba(255,255,255,0.58);
      text-transform:uppercase;
      letter-spacing:0.16em;
      font-size:0.68rem;
    }
    .title{
      margin:0;
      color:#fff;
      font-size:clamp(1.2rem, 2.2vw, 1.65rem);
      line-height:1.14;
      font-weight:700;
    }
    .copy{
      margin:12px 0 0 0;
      color:var(--muted);
      line-height:1.55;
      font-size:0.96rem;
      max-width:44ch;
    }
    .actions{
      margin-top:16px;
      display:flex;
      flex-wrap:wrap;
      gap:12px;
    }
    .btn{
      min-height:44px;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      padding:0 18px;
      border-radius:999px;
      text-decoration:none;
      text-transform:uppercase;
      letter-spacing:0.10em;
      font-size:0.72rem;
      font-weight:700;
      border:1px solid rgba(255,255,255,0.14);
      transition:transform 180ms ease, border-color 180ms ease, background 180ms ease, color 180ms ease;
    }
    .btn:hover,
    .btn:focus-visible{
      transform:translateY(-2px);
      border-color:rgba(255,255,255,0.28);
      outline:none;
    }
    .btn.primary{
      color:#fff;
      background:linear-gradient(135deg, rgba(255,73,207,0.25), rgba(132,93,255,0.26));
    }
    .btn.secondary{
      color:rgba(255,255,255,0.88);
      background:rgba(255,255,255,0.04);
    }
    .hint{
      position:absolute;
      top:50%;
      left:50%;
      transform:translate(-50%, -50%);
      color:rgba(255,255,255,0.24);
      text-transform:uppercase;
      letter-spacing:0.14em;
      font-size:0.7rem;
      white-space:nowrap;
      user-select:none;
    }
    .status{
      position:absolute;
      right:24px;
      bottom:calc(24px + env(safe-area-inset-bottom));
      padding:11px 14px;
      border-radius:999px;
      border:1px solid var(--line);
      background:var(--panel);
      backdrop-filter:blur(20px);
      -webkit-backdrop-filter:blur(20px);
      color:rgba(255,255,255,0.60);
      text-transform:uppercase;
      letter-spacing:0.12em;
      font-size:0.64rem;
      pointer-events:none;
    }
    @media (max-width: 820px){
      .nav{
        padding-left:14px;
        padding-right:14px;
        align-items:flex-start;
        flex-direction:column;
      }
      .navlinks{gap:12px; justify-content:flex-start}
      .panel{
        left:14px;
        width:calc(100vw - 28px);
        bottom:calc(14px + env(safe-area-inset-bottom));
      }
      .status{
        right:14px;
        bottom:auto;
        top:calc(96px + env(safe-area-inset-top));
      }
      .hint{top:58%}
    }
  </style>
</head>
<body>
  <div id="app"></div>

  <div class="ui">
    <div class="nav">
      <a class="brand" href="./index.html">James Preston Cardona</a>
      <div class="navlinks">
        <a href="./index.html#work">Work</a>
        <a href="./index.html#about">About</a>
        <a href="./resume.html">Resume</a>
        <a href="./index.html#contact">Contact</a>
      </div>
    </div>

    <h1 class="hero404">404</h1>
    <div class="hint">Move your mouse or drag to disturb the surface</div>

    <section class="panel">
      <p class="eyebrow">Page not found</p>
      <h2 class="title">The page disappeared into the signal field.</h2>
      <div class="actions">
        <a class="btn primary" href="./index.html">Return Home</a>
        <a class="btn secondary" href="./index.html#work">View Work</a>
      </div>
    </section>

    <div class="status" id="status">Loading signal field</div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
  <script>
    (function(){
      const app = document.getElementById('app');
      const status = document.getElementById('status');
      if (!window.THREE) {
        status.textContent = 'Three.js failed to load';
        return;
      }

      const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false, powerPreference: 'high-performance' });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.75));
      renderer.outputEncoding = THREE.sRGBEncoding;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.18;
      app.appendChild(renderer.domElement);

      const scene = new THREE.Scene();
      const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);

      const uniforms = {
        uTime: { value: 0 },
        uResolution: { value: new THREE.Vector2(window.innerWidth, window.innerHeight) },
        uMouse: { value: new THREE.Vector2(0, 0) }
      };

      const material = new THREE.ShaderMaterial({
        uniforms,
        vertexShader: `
          varying vec2 vUv;
          void main(){
            vUv = uv;
            gl_Position = vec4(position.xy, 0.0, 1.0);
          }
        `,
        fragmentShader: `
          precision highp float;
          varying vec2 vUv;
          uniform vec2 uResolution;
          uniform vec2 uMouse;
          uniform float uTime;

          #define MAX_STEPS 84
          #define MAX_DIST 26.0
          #define SURF_DIST 0.0025

          mat2 rot(float a){
            float s = sin(a), c = cos(a);
            return mat2(c,-s,s,c);
          }

          float hash21(vec2 p){
            p = fract(p * vec2(123.34, 456.21));
            p += dot(p, p + 45.32);
            return fract(p.x * p.y);
          }

          float hash31(vec3 p){
            p = fract(p * 0.1031);
            p += dot(p, p.yzx + 33.33);
            return fract((p.x + p.y) * p.z);
          }

          float noise(vec3 x){
            vec3 i = floor(x);
            vec3 f = fract(x);
            f = f * f * (3.0 - 2.0 * f);

            float n000 = hash31(i + vec3(0.0, 0.0, 0.0));
            float n100 = hash31(i + vec3(1.0, 0.0, 0.0));
            float n010 = hash31(i + vec3(0.0, 1.0, 0.0));
            float n110 = hash31(i + vec3(1.0, 1.0, 0.0));
            float n001 = hash31(i + vec3(0.0, 0.0, 1.0));
            float n101 = hash31(i + vec3(1.0, 0.0, 1.0));
            float n011 = hash31(i + vec3(0.0, 1.0, 1.0));
            float n111 = hash31(i + vec3(1.0, 1.0, 1.0));

            float nx00 = mix(n000, n100, f.x);
            float nx10 = mix(n010, n110, f.x);
            float nx01 = mix(n001, n101, f.x);
            float nx11 = mix(n011, n111, f.x);
            float nxy0 = mix(nx00, nx10, f.y);
            float nxy1 = mix(nx01, nx11, f.y);
            return mix(nxy0, nxy1, f.z);
          }

          float fbm(vec3 p){
            float v = 0.0;
            float a = 0.5;
            for(int i = 0; i < 5; i++){
              v += a * noise(p);
              p *= 2.03;
              a *= 0.5;
            }
            return v;
          }

          float smin(float a, float b, float k){
            float h = clamp(0.5 + 0.5 * (b - a) / k, 0.0, 1.0);
            return mix(b, a, h) - k * h * (1.0 - h);
          }

          vec2 map(vec3 p){
            float t = uTime * 0.42;
            vec3 q = p;

            float blobA =
              length(q * vec3(1.0, 1.15, 0.95)) -
              1.38;

            float blobB =
              length(
                q -
                vec3(0.95, 0.38, 0.34)
              ) -
              0.92;

            float blobC =
              length(
                q -
                vec3(-0.92, -0.46, -0.38)
              ) -
              0.98;

            vec3 ribbonP = q;
            ribbonP.x +=
              sin(ribbonP.z * 2.0) *
              0.35;

            ribbonP.y +=
              cos(ribbonP.x * 1.7) *
              0.26;

            float ribbon =
              length(
                vec2(
                  length(ribbonP.xy) - 1.5,
                  ribbonP.z * 0.6
                )
              ) -
              0.24;

            float d =
              smin(
                blobA,
                blobB,
                0.6
              );

            d =
              smin(
                d,
                blobC,
                0.6
              );

            d =
              smin(
                d,
                ribbon,
                0.38
              );

            // The sculpture stays fixed. Only its surface flows.
            float surfaceFlow =
              (
                fbm(
                  q * 2.15 +
                  vec3(
                    0.0,
                    0.0,
                    t * 0.62
                  )
                ) -
                0.5
              ) *
              0.15;

            vec2 mouse =
              uMouse;

            vec3 mousePoint =
              vec3(
                mouse.x * 1.75,
                mouse.y * 1.35,
                0.65
              );

            float mouseDistance =
              length(
                q -
                mousePoint
              );

            float mouseInfluence =
              exp(
                -1.35 *
                mouseDistance *
                mouseDistance
              );

            float mouseRipple =
              sin(
                mouseDistance *
                9.0 -
                t *
                2.2
              ) *
              0.13 *
              mouseInfluence;

            float directionalSurface =
              (
                sin(
                  q.y * 3.8 +
                  mouse.x * 3.0 +
                  t * 0.75
                ) *
                cos(
                  q.x * 3.5 -
                  mouse.y * 3.0 -
                  t * 0.62
                )
              ) *
              0.035 *
              mouseInfluence;

            d +=
              surfaceFlow +
              mouseRipple +
              directionalSurface;

            float glowId = 0.0;

            if(
              blobB <
              d + 0.05
            ){
              glowId = 1.0;
            }

            if(
              blobC <
              d + 0.05
            ){
              glowId = 2.0;
            }

            if(
              ribbon <
              d + 0.05
            ){
              glowId = 3.0;
            }

            return vec2(
              d,
              glowId
            );
          }

          vec3 palette(float t){
            vec3 pink = vec3(1.06, 0.12, 0.72);
            vec3 purple = vec3(0.42, 0.16, 1.02);
            vec3 lavender = vec3(0.68, 0.26, 0.96);
            vec3 white = vec3(0.98, 0.96, 1.04);

            float a = smoothstep(0.0, 0.45, t);
            float b = smoothstep(0.28, 0.78, t);
            float cMix = smoothstep(0.55, 1.0, t);

            vec3 col = mix(purple, lavender, a);
            col = mix(col, pink, b);
            col = mix(col, white, cMix * 0.12 + 0.04);
            col = mix(col, lavender, 0.22);
            return col * 1.02;
          }

          vec3 background(vec2 uv){
            vec2 p = uv;
            float vign = 1.0 - dot(p, p) * 0.28;
            float stars = 0.0;
            vec2 gv = fract((uv + 1.0) * vec2(14.0, 10.0)) - 0.5;
            vec2 id = floor((uv + 1.0) * vec2(14.0, 10.0));
            float h = hash21(id);
            float spark = smoothstep(0.05, 0.0, length(gv)) * step(0.92, h);
            stars += spark;
            vec3 base = mix(vec3(0.012,0.008,0.028), vec3(0.032,0.018,0.065), 0.5 + 0.5 * uv.y);
            vec3 glowA = vec3(0.96,0.12,0.70) * exp(-6.8 * length(uv - vec2(-0.48, 0.20))) * 0.20;
            vec3 glowB = vec3(0.48,0.16,1.06) * exp(-6.2 * length(uv - vec2(0.42, -0.10))) * 0.24;
            vec3 glowMid = vec3(0.74,0.20,0.92) * exp(-4.5 * length(uv - vec2(0.0, 0.04))) * 0.11;
            base += glowA + glowB + glowMid;
            base = mix(base, (glowA + glowB + glowMid) * 0.90 + base, 0.32);
            base += stars * 0.38;
            return base * vign;
          }

          vec3 render(vec2 fragCoord){
            vec2 uv = (fragCoord - 0.5 * uResolution.xy) / uResolution.y;
            vec3 ro = vec3(0.0, 0.0, 5.8);
            vec3 rd = normalize(vec3(uv, -1.55));

            vec3 col = background(uv);
            float t = 0.0;
            float glow = 0.0;
            float density = 0.0;
            vec3 accum = vec3(0.0);

            for(int i = 0; i < MAX_STEPS; i++){
              vec3 pos = ro + rd * t;
              vec2 res = map(pos);
              float d = res.x;
              float id = res.y;

              float nearField = exp(-18.0 * abs(d));
              float shell = exp(-38.0 * abs(d));
              float pulse = 0.55 + 0.45 * sin(uTime * 1.5 + pos.z * 1.3 + pos.x * 0.8);

              float colorField = 0.5 + 0.5 * sin(
                pos.x * 0.32 + pos.y * 0.28 + pos.z * 0.22 +
                id * 0.55 + uTime * 0.16 + fbm(pos * 0.75) * 2.2
              );
              vec3 localCol = mix(
                palette(colorField),
                palette(clamp(colorField * 0.72 + 0.16, 0.0, 1.0)),
                0.38
              );
              accum += localCol * nearField * 0.050 * pulse;
              accum += vec3(1.08, 1.02, 1.12) * shell * 0.022;
              density += nearField * 0.030;
              glow += shell * 0.030;

              if(d < SURF_DIST){
                accum += localCol * 0.32;
                break;
              }
              t += clamp(abs(d) * 0.75, 0.02, 0.24);
              if(t > MAX_DIST) break;
            }

            col += accum;
            col += vec3(0.98,0.14,0.74) * glow * 1.14;
            col += vec3(0.50,0.20,1.02) * density * 1.18;

            float haze = exp(-length(uv) * 2.2);
            col += vec3(0.10, 0.03, 0.14) * haze;

            float vign = smoothstep(1.35, 0.25, length(uv));
            col *= vign;

            col = 1.0 - exp(-col * 1.44);
            col = mix(col, vec3((col.r + col.b) * 0.5, (col.g + col.r) * 0.45, (col.b + col.r) * 0.5), 0.06);
            col = pow(col, vec3(0.95));
            return col;
          }

          void main(){
            vec3 col = render(gl_FragCoord.xy);
            gl_FragColor = vec4(col, 1.0);
          }
        `
      });

      const mesh = new THREE.Mesh(new THREE.PlaneBufferGeometry(2, 2), material);
      scene.add(mesh);

      let targetMouseX = 0;
      let targetMouseY = 0;
      let currentMouseX = 0;
      let currentMouseY = 0;

      function updateMouse(x, y){
        targetMouseX = (x / window.innerWidth) * 2 - 1;
        targetMouseY = (y / window.innerHeight) * 2 - 1;
      }

      window.addEventListener('pointermove', (e) => updateMouse(e.clientX, e.clientY), { passive: true });
      window.addEventListener('touchmove', (e) => {
        if (e.touches && e.touches[0]) updateMouse(e.touches[0].clientX, e.touches[0].clientY);
      }, { passive: true });

      function resize(){
        const w = window.innerWidth;
        const h = window.innerHeight;
        renderer.setSize(w, h);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, w < 820 ? 1.4 : 1.75));
        uniforms.uResolution.value.set(w, h);
      }
      window.addEventListener('resize', resize);
      resize();

      const clock = new THREE.Clock();
      status.textContent = 'Signal field active · surface response';

      function animate(){
        requestAnimationFrame(animate);
        uniforms.uTime.value = clock.getElapsedTime();
        currentMouseX += (targetMouseX - currentMouseX) * 0.12;
        currentMouseY += (targetMouseY - currentMouseY) * 0.12;
        uniforms.uMouse.value.set(currentMouseX, -currentMouseY);
        renderer.render(scene, camera);
      }
      animate();
    })();
  </script>
</body>
</html>
