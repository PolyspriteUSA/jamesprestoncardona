name: Sync ArtStation portfolio
on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-artstation.yml'
      - 'scripts/sync-artstation.py'
      - 'scripts/build-projects.cjs'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: artstation-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch complete portfolio
        run: python scripts/sync-artstation.py
      - name: Build native project pages
        run: node scripts/build-projects.cjs
      - name: Commit changes
        id: commit
        run: |
          git add data/artstation-projects.json archviz.html project-*.html
          if git diff --cached --quiet; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Sync portfolio from ArtStation'
            git push
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi
      # Bot commits do not trigger the usual Pages build, so deploy explicitly.
      - uses: actions/upload-pages-artifact@v3
        if: steps.commit.outputs.changed == 'true' || github.event_name != 'schedule'
        with:
          path: '.'
      - uses: actions/deploy-pages@v4
        if: steps.commit.outputs.changed == 'true' || github.event_name != 'schedule'
    environment:
      name: github-pages
